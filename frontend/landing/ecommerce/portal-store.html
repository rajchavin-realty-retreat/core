<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Material Store | Raj Chavin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { dark: '#050505', gold: '#D4AF37' } } }
        }
    </script>
    <style>
        .nav-glass { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(8px); 
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .dark .nav-glass { 
            background: rgba(5, 5, 5, 0.95); 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
        }
        .solid-panel { background: #ffffff; border: 1px solid #e5e7eb; }
        .dark .solid-panel { background: #121212; border: 1px solid #333; }
        
        .product-card { transition: transform 0.2s, border-color 0.2s; }
        .product-card:hover { transform: translateY(-2px); border-color: #D4AF37; }

        #cart-panel { transform: translateX(100%); transition: transform 0.3s ease-in-out; }
        #cart-panel.open { transform: translateX(0); }
        .cat-btn.active { background: #D4AF37; color: black; border-color: #D4AF37; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-dark dark:text-gray-300 font-sans min-h-screen transition-colors duration-300">

    <nav class="fixed top-0 w-full z-50 nav-glass transition-colors">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="flex items-center gap-2 flex-shrink-0 mr-4">
                <a href="../index.html"><img src="../Gemini_Generated_Image_hd7sbhd7sbhd7sbh-removebg-preview.png" alt="Raj Chavin Logo" class="h-10 w-auto object-contain"></a>
                </div>
            <span class="font-serif text-lg font-bold tracking-wide hidden sm:block">Material Store</span>
            </div>
            
            <div class="flex items-center gap-4">
                <a href="../index.html" class="text-sm font-bold hover:text-gold transition hidden sm:block">Home</a>

                <button id="theme-toggle" class="w-8 h-8 rounded-full bg-gray-200 dark:bg-white/10 flex items-center justify-center hover:bg-gold transition">
                    <i class="fas fa-sun hidden dark:block text-xs"></i>
                    <i class="fas fa-moon block dark:hidden text-xs"></i>
                </button>

                <button onclick="toggleCart()" class="relative p-2 hover:text-gold transition">
                    <i class="fas fa-shopping-bag text-xl"></i>
                    <span id="cart-count" class="absolute top-0 right-0 bg-gold text-dark text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                </button>
                
                <div class="flex items-center gap-3">
                    <span id="userGreeting" class="text-xs font-bold text-gold uppercase tracking-wider hidden sm:block"></span>
                    <button id="authBtn" class="text-xs font-bold uppercase tracking-widest hover:text-gold border border-gold px-3 py-1 rounded">Login</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="pt-24 pb-12 px-4 max-w-7xl mx-auto flex flex-col lg:flex-row gap-8">
        
        <div class="w-full lg:w-64 flex-shrink-0">
            <div class="solid-panel p-4 rounded-xl sticky top-24 shadow-sm">
                <div class="mb-6">
                    <h3 class="font-serif font-bold text-lg mb-2 text-gold">Search</h3>
                    <div class="relative">
                        <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Find materials..." class="w-full bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-lg p-2 pl-8 text-sm outline-none focus:border-gold">
                        <i class="fas fa-search absolute left-2.5 top-2.5 text-gray-500 text-xs"></i>
                    </div>
                </div>

                <h3 class="font-serif font-bold text-lg mb-4 hidden lg:block text-gold">Categories</h3>
                <div class="flex lg:flex-col gap-2 overflow-x-auto lg:overflow-visible scrollbar-hide" id="catContainer">
                    <button onclick="selectCategory('all')" class="cat-btn active px-4 py-2 rounded-lg border border-gray-200 dark:border-white/10 text-left text-sm hover:border-gold" data-val="all">All Products</button>
                    <button onclick="selectCategory('construction')" class="cat-btn px-4 py-2 rounded-lg border border-gray-200 dark:border-white/10 text-left text-sm hover:border-gold" data-val="construction">Construction</button>
                    <button onclick="selectCategory('interiors')" class="cat-btn px-4 py-2 rounded-lg border border-gray-200 dark:border-white/10 text-left text-sm hover:border-gold" data-val="interiors">Interiors</button>
                    <button onclick="selectCategory('electrical')" class="cat-btn px-4 py-2 rounded-lg border border-gray-200 dark:border-white/10 text-left text-sm hover:border-gold" data-val="electrical">Electrical</button>
                    <button onclick="selectCategory('security')" class="cat-btn px-4 py-2 rounded-lg border border-gray-200 dark:border-white/10 text-left text-sm hover:border-gold" data-val="security">Security</button>
                    <button onclick="selectCategory('plumbing')" class="cat-btn px-4 py-2 rounded-lg border border-gray-200 dark:border-white/10 text-left text-sm hover:border-gold" data-val="plumbing">Plumbing</button>
                </div>
            </div>
        </div>

        <div class="flex-1">
            <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
    </div>

    <div id="cart-backdrop" onclick="toggleCart()" class="fixed inset-0 bg-black/80 z-[60] hidden"></div>
    <div id="cart-panel" class="fixed top-0 right-0 h-full w-full max-w-md bg-white dark:bg-[#121212] z-[70] shadow-2xl flex flex-col border-l border-white/10">
        <div class="p-6 border-b border-gray-200 dark:border-white/10 flex justify-between items-center bg-gray-50 dark:bg-white/5">
            <h2 class="font-serif text-xl font-bold">Your Cart</h2>
            <button onclick="toggleCart()"><i class="fas fa-times text-xl"></i></button>
        </div>
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
        <div class="p-6 border-t border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5">
            <div class="flex justify-between mb-4 text-sm"><span>Subtotal</span><span id="cart-total" class="font-bold font-mono">₹0</span></div>
            <button onclick="initiateCheckout()" class="w-full py-4 bg-gold text-dark font-bold rounded-xl hover:bg-white transition uppercase tracking-widest">Checkout</button>
        </div>
    </div>

    <div id="profile-modal" class="fixed inset-0 bg-black/90 z-[80] hidden items-center justify-center">
        <div class="solid-panel p-8 rounded-2xl max-w-sm w-full text-center">
            <i class="fas fa-user-edit text-4xl text-gold mb-4"></i>
            <h3 class="text-xl font-bold dark:text-white mb-2">Complete Profile</h3>
            <input id="missingName" type="text" placeholder="Full Name" class="w-full bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-lg p-3 mb-3 text-sm outline-none focus:border-gold">
            <input id="missingPhone" type="tel" placeholder="Phone Number" class="w-full bg-gray-100 dark:bg-white/5 border border-gray-200 dark:border-white/10 rounded-lg p-3 mb-6 text-sm outline-none focus:border-gold">
            <button onclick="saveDetailsAndOrder()" class="w-full bg-gold text-dark font-bold py-3 rounded-lg hover:bg-white transition">Save & Place Order</button>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, addDoc, getDocs, query, where, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        let cart = [], allProducts = [], currentUser = null, userProfile = null;
        let activeCategory = 'all';

        // --- DEFINE FUNCTIONS FIRST ---

        window.updateCartUI = () => {
            document.getElementById('cart-count').innerText = cart.reduce((a, b) => a + b.qty, 0);
            document.getElementById('cart-count').classList.toggle('hidden', cart.length === 0);
            document.getElementById('cart-total').innerText = "₹" + cart.reduce((a, b) => a + (b.price * b.qty), 0).toLocaleString();
            
            document.getElementById('cart-items').innerHTML = cart.map((i, idx) => `
                <div class="flex gap-4 items-center bg-gray-50 dark:bg-white/5 p-3 rounded-xl border border-gray-200 dark:border-white/5">
                    <img src="${i.image}" class="w-12 h-12 rounded-lg object-cover">
                    <div class="flex-1">
                        <h5 class="text-sm font-bold dark:text-white line-clamp-1">${i.name}</h5>
                        <div class="flex justify-between mt-1">
                            <span class="text-xs text-gray-500 dark:text-gray-400">${i.qty} x ₹${i.price}</span>
                            <span class="text-gold text-sm font-bold">₹${(i.price*i.qty).toLocaleString()}</span>
                        </div>
                    </div>
                    <button onclick="window.removeFromCart(${idx})" class="text-gray-400 hover:text-red-500"><i class="fas fa-trash-alt"></i></button>
                </div>`).join('');
        };

        function saveCartState() {
            localStorage.setItem('rc_cart', JSON.stringify(cart));
            window.updateCartUI();
        }

        window.addToCart = (id) => {
            if(!currentUser) { if(confirm("Login to shop?")) window.location.href = 'store-login.html'; return; }
            const prod = allProducts.find(p => p.id === id);
            const qty = parseInt(document.getElementById(`qty-${id}`).value);
            
            const exist = cart.find(i => i.id === id);
            if(exist) {
                exist.qty += qty;
            } else {
                cart.push({ ...prod, qty });
            }
            saveCartState(); 
            toggleCart(true);
        };

        window.removeFromCart = (index) => {
            cart.splice(index, 1);
            saveCartState();
        };

        window.changeQty = (id, d) => { const el = document.getElementById(`qty-${id}`); el.value = Math.max(1, parseInt(el.value) + d); };

        window.toggleCart = (f) => { const p = document.getElementById('cart-panel'), b = document.getElementById('cart-backdrop'); const o = f!==undefined?f:!p.classList.contains('open'); p.classList.toggle('open', o); b.classList.toggle('hidden', !o); };

        // --- INIT ---
        const savedCart = localStorage.getItem('rc_cart');
        if (savedCart) {
            cart = JSON.parse(savedCart);
            window.updateCartUI(); 
        }

        // Theme Toggle Logic
        const themeBtn = document.getElementById('theme-toggle');
        // Note: Initial check is done in HEAD script to prevent flicker
        themeBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        });

        onAuthStateChanged(auth, async (user) => {
            const btn = document.getElementById('authBtn');
            const greetingEl = document.getElementById('userGreeting');

            if (user) {
                currentUser = user;
                const snap = await getDoc(doc(db, "users", user.uid));
                
                let displayName = "Member";
                if(snap.exists()) {
                    userProfile = snap.data();
                    if(userProfile.name) displayName = userProfile.name;
                    if(userProfile.role === 'admin') window.location.href = 'portal-store-admin.html';
                    if(userProfile.role === 'supplier') window.location.href = 'portal-store-supplier.html';
                }
                
                greetingEl.innerText = `Hello, ${displayName}`;
                greetingEl.classList.remove('hidden');
                btn.innerText = "Logout";
                btn.onclick = () => signOut(auth).then(() => window.location.reload());
            } else {
                currentUser = null;
                greetingEl.classList.add('hidden');
                btn.innerText = "Login";
                btn.onclick = () => window.location.href = 'store-login.html';
            }
            fetchProducts();
        });

        async function fetchProducts() {
            try {
                const q = query(collection(db, "products"), where("blocked", "==", false));
                const snap = await getDocs(q);
                allProducts = [];
                snap.forEach(doc => allProducts.push({ id: doc.id, ...doc.data() }));
                applyFilters(); 
            } catch (err) { console.error(err); }
        }

        window.selectCategory = (cat) => {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.val === cat));
            applyFilters();
        };

        window.applyFilters = () => {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesCat = activeCategory === 'all' || p.category === activeCategory;
                const matchesSearch = p.name.toLowerCase().includes(term);
                return matchesCat && matchesSearch;
            });
            renderProducts(filtered);
        };

        function renderProducts(list) {
            const grid = document.getElementById('product-grid');
            if(list.length === 0) { grid.innerHTML = '<p class="col-span-full text-center opacity-50 py-10">No products found.</p>'; return; }
            
            grid.innerHTML = list.map(p => `
                <div class="product-card solid-panel rounded-2xl overflow-hidden flex flex-col h-full">
                    <div class="h-48 overflow-hidden relative">
                        <img src="${p.image}" class="w-full h-full object-cover">
                        <div class="absolute top-3 right-3 bg-black/80 text-white text-[10px] font-bold px-2 py-1 rounded uppercase">${p.category}</div>
                    </div>
                    <div class="p-5 flex flex-col flex-1">
                        <h4 class="font-bold text-lg mb-1 line-clamp-1 dark:text-white">${p.name}</h4>
                        
                        <p class="text-xs text-gray-500 dark:text-gray-400 mb-4 line-clamp-2 h-8">
                            ${p.description || "No description provided."}
                        </p>

                        <div class="mt-auto pt-3 border-t border-gray-200 dark:border-white/10">
                            <div class="flex justify-between items-end mb-2">
                                <span class="text-gold font-mono font-bold text-lg">₹${p.price.toLocaleString()} <span class="text-xs font-sans text-gray-500 font-normal">/${p.unit||'pc'}</span></span>
                            </div>
                            <div class="flex items-center gap-2">
                                <div class="flex items-center bg-gray-100 dark:bg-white/5 rounded-lg border border-gray-200 dark:border-white/10 p-1 flex-1">
                                    <button onclick="changeQty('${p.id}', -1)" class="w-8 h-8 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-white/10 text-gray-500 dark:text-gray-400">-</button>
                                    <input type="number" id="qty-${p.id}" value="1" min="1" class="w-full bg-transparent text-center text-sm font-bold outline-none text-gray-800 dark:text-white">
                                    <button onclick="changeQty('${p.id}', 1)" class="w-8 h-8 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-white/10 text-gray-500 dark:text-gray-400">+</button>
                                </div>
                                <button onclick="addToCart('${p.id}')" class="bg-gold text-dark font-bold px-4 py-2 rounded-lg hover:bg-white transition text-sm">Add</button>
                            </div>
                        </div>
                    </div>
                </div>`).join('');
        }

        window.initiateCheckout = () => {
            if(cart.length===0) return;
            if(!userProfile.name || !userProfile.phone) {
                document.getElementById('missingName').value = userProfile.name||''; document.getElementById('missingPhone').value = userProfile.phone||'';
                document.getElementById('profile-modal').style.display = 'flex'; toggleCart(false);
            } else placeOrder();
        };

        window.saveDetailsAndOrder = async () => {
            const n = document.getElementById('missingName').value, p = document.getElementById('missingPhone').value;
            if(!n || !p) return alert("Fill all fields");
            await updateDoc(doc(db, "users", currentUser.uid), { name: n, phone: p });
            userProfile.name = n; userProfile.phone = p;
            document.getElementById('profile-modal').style.display = 'none'; placeOrder();
        };

        async function placeOrder() {
            if(!confirm(`Confirm order?`)) return;
            try {
                await addDoc(collection(db, "orders"), {
                    userId: currentUser.uid, userEmail: currentUser.email, userName: userProfile.name, userPhone: userProfile.phone,
                    items: cart, totalAmount: cart.reduce((a,b)=>a+(b.price*b.qty),0), status: 'pending', createdAt: serverTimestamp()
                });
                alert("Order Placed!"); 
                cart=[]; 
                localStorage.removeItem('rc_cart'); 
                updateCartUI();
            } catch(e) { alert("Error: "+e.message); }
        }
    </script>
</body>
</html>
