<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raj Chavin | Access Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { dark: '#050505', surface: '#121212', gold: '#D4AF37', pearl: '#F9FAFB' },
                    fontFamily: { sans: ['Manrope', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    backgroundImage: { 'hero-pattern': "url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80')" }
                }
            }
        }
    </script>
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .dark .glass-panel { background: rgba(18, 18, 18, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .input-field { background: rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.1); color: #333; padding: 12px; border-radius: 8px; width: 100%; transition: all 0.3s; }
        .dark .input-field { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; }
        .input-field:focus { border-color: #D4AF37; outline: none; }
    </style>
</head>
<body class="bg-pearl text-gray-900 dark:bg-dark dark:text-gray-300 font-sans min-h-screen flex flex-col transition-colors duration-300">

    <nav class="fixed top-0 w-full z-50 px-4 py-4">
        <div class="max-w-7xl mx-auto glass-panel rounded-2xl px-4 py-3 flex justify-between items-center transition-all">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gold rounded-lg flex items-center justify-center text-white font-bold font-serif shadow-md">RC</div>
                <span class="font-serif text-lg font-bold text-gray-900 dark:text-white tracking-wide hidden sm:block">Raj Chavin</span>
            </a>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="w-9 h-9 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center hover:scale-110 transition">
                    <i class="fas fa-sun hidden dark:block text-gold text-xs"></i><i class="fas fa-moon block dark:hidden text-gray-600 text-xs"></i>
                </button>
                <a href="../index.html" class="text-xs font-bold uppercase tracking-widest hover:text-gold">Home</a>
            </div>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center p-4 relative pt-24 pb-12">
        <div class="absolute inset-0 bg-hero-pattern bg-cover bg-center bg-fixed opacity-5 dark:opacity-20"></div>
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-pearl dark:to-dark"></div>

        <div class="relative z-10 w-full max-w-5xl bg-white/60 dark:bg-white/5 backdrop-blur-xl rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row border border-white/20 dark:border-white/5">
            <div class="w-full md:w-1/2 h-48 md:h-auto bg-[url('https://images.unsplash.com/photo-1613490493576-7fde63acd811?ixlib=rb-4.0.3&auto=format&fit=crop&w=1600&q=80')] bg-cover bg-center relative flex flex-col justify-end p-8 md:p-12">
                <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/40 to-transparent"></div>
                <div class="relative z-10">
                    <h2 class="text-3xl md:text-4xl font-serif text-white mb-2 leading-tight">Architecting <br><span class="text-gold italic">Legacies.</span></h2>
                    <p class="text-gray-300 text-sm font-light hidden md:block">Access the ecosystem where luxury meets legacy.</p>
                </div>
            </div>

            <div class="w-full md:w-1/2 p-6 md:p-12 flex flex-col justify-center">
                <div class="flex border-b border-gray-200 dark:border-white/10 mb-8">
                    <button onclick="switchTab('login')" id="tab-login" class="pb-3 px-4 text-gold border-b-2 border-gold font-bold transition w-1/2 text-sm uppercase tracking-wider">Sign In</button>
                    <button onclick="switchTab('signup')" id="tab-signup" class="pb-3 px-4 text-gray-400 hover:text-gray-900 dark:hover:text-white transition w-1/2 text-sm uppercase tracking-wider">Join</button>
                </div>

                <form id="loginForm" class="space-y-5">
                    <div><label class="block text-[10px] uppercase font-bold mb-2 opacity-70">Email</label><input type="email" id="loginEmail" class="input-field" placeholder="client@example.com" required></div>
                    <div><label class="block text-[10px] uppercase font-bold mb-2 opacity-70">Password</label><input type="password" id="loginPass" class="input-field" placeholder="••••••••" required></div>
                    <button type="submit" class="w-full bg-gold text-dark font-bold py-4 rounded-xl hover:bg-yellow-500 transition shadow-lg shadow-gold/20">Access Dashboard</button>
                </form>

                <form id="signupForm" class="space-y-4 hidden">
                    <div class="grid grid-cols-2 gap-3"><input type="text" id="regName" class="input-field" placeholder="Full Name" required><input type="tel" id="regPhone" class="input-field" placeholder="Phone" required></div>
                    <select id="regRole" class="input-field cursor-pointer"><option value="buyer" class="text-black">I want to Buy/Rent</option><option value="seller" class="text-black">I want to Sell/Lease</option></select>
                    <input type="email" id="regEmail" class="input-field" placeholder="Email" required><input type="password" id="regPass" class="input-field" placeholder="Password" required>
                    <button type="submit" class="w-full border border-gold text-gold font-bold py-4 rounded-xl hover:bg-gold hover:text-dark transition">Create Account</button>
                </form>
                <p id="errorMsg" class="text-red-500 text-xs mt-6 text-center hidden p-3 bg-red-100 dark:bg-red-900/20 rounded-lg"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Theme
        const themeBtn = document.getElementById('theme-toggle');
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        themeBtn.addEventListener('click', () => { document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light'; });

        // Tabs
        window.switchTab = (tab) => {
            const login = document.getElementById('loginForm'); const signup = document.getElementById('signupForm');
            const btnL = document.getElementById('tab-login'); const btnS = document.getElementById('tab-signup');
            if(tab === 'login') { login.classList.remove('hidden'); signup.classList.add('hidden'); btnL.classList.add('text-gold','border-gold'); btnL.classList.remove('text-gray-400'); btnS.classList.remove('text-gold','border-gold'); btnS.classList.add('text-gray-400'); }
            else { login.classList.add('hidden'); signup.classList.remove('hidden'); btnS.classList.add('text-gold','border-gold'); btnS.classList.remove('text-gray-400'); btnL.classList.remove('text-gold','border-gold'); btnL.classList.add('text-gray-400'); }
        };

        // Logic
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const cred = await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPass').value);
                if(cred.user.email === 'admin@rajchavin.com') { window.location.href = 'portal-admin.html'; return; }
                const docSnap = await getDoc(doc(db, "users", cred.user.uid));
                if (docSnap.exists()) window.location.href = docSnap.data().role === 'seller' ? 'portal-seller.html' : 'portal-buyer.html';
            } catch (err) { document.getElementById('errorMsg').innerText = err.message; document.getElementById('errorMsg').classList.remove('hidden'); }
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const cred = await createUserWithEmailAndPassword(auth, document.getElementById('regEmail').value, document.getElementById('regPass').value);
                await setDoc(doc(db, "users", cred.user.uid), { name: document.getElementById('regName').value, phone: document.getElementById('regPhone').value, role: document.getElementById('regRole').value, email: cred.user.email });
                if(cred.user.email === 'admin@rajchavin.com') window.location.href = 'portal-admin.html';
                else window.location.href = document.getElementById('regRole').value === 'seller' ? 'portal-seller.html' : 'portal-buyer.html';
            } catch (err) { document.getElementById('errorMsg').innerText = err.message; document.getElementById('errorMsg').classList.remove('hidden'); }
        });
    </script>
</body>
</html>
