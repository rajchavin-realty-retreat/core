<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin HQ | Raj Chavin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { dark: '#050505', surface: '#121212', gold: '#D4AF37', pearl: '#F9FAFB' },
                    fontFamily: { sans: ['Manrope', 'sans-serif'], serif: ['Playfair Display', 'serif'] },
                    backgroundImage: { 'hero-pattern': "url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?ixlib=rb-4.0.3&auto=format&fit=crop&w=2070&q=80')" }
                }
            }
        }
    </script>
    <style>
        .glass-panel { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.5); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .dark .glass-panel { background: rgba(18, 18, 18, 0.8); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        
        /* Hide Scrollbar for Gallery */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Luxury Button */
        .btn-gold { background: #D4AF37; color: #050505; font-weight: 700; transition: all 0.3s; }
        .btn-gold:hover { background: #fff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3); }
        
        .btn-outline { border: 1px solid rgba(156, 163, 175, 0.3); color: #6b7280; transition: all 0.3s; }
        .dark .btn-outline { color: #9ca3af; border-color: rgba(255, 255, 255, 0.1); }
        .btn-outline:hover { border-color: #D4AF37; color: #D4AF37; }
        .btn-outline.active { border-color: #D4AF37; color: #D4AF37; background: rgba(212, 175, 55, 0.1); }
    </style>
</head>
<body class="bg-pearl text-gray-900 dark:bg-dark dark:text-gray-300 font-sans min-h-screen transition-colors duration-300 pb-20">

    <nav class="fixed top-0 w-full z-50 px-4 py-4">
        <div class="max-w-7xl mx-auto glass-panel rounded-2xl px-4 py-3 flex justify-between items-center transition-all">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gold rounded-lg flex items-center justify-center text-white font-bold font-serif shadow-md">A</div>
                <span class="font-serif text-lg font-bold text-gray-900 dark:text-white tracking-wide">Admin HQ</span>
            </div>
            <div class="flex items-center gap-4">
                <button id="theme-toggle" class="w-9 h-9 rounded-full bg-black/5 dark:bg-white/10 flex items-center justify-center hover:scale-110 transition">
                    <i class="fas fa-sun hidden dark:block text-gold text-xs"></i>
                    <i class="fas fa-moon block dark:hidden text-gray-600 text-xs"></i>
                </button>
                <button id="logoutBtn" class="text-xs font-bold uppercase tracking-widest hover:text-gold transition">Exit</button>
            </div>
        </div>
    </nav>

    <div class="pt-28 px-4 max-w-7xl mx-auto">
        
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-8 gap-4">
            <div>
                <h1 class="text-3xl font-serif font-bold text-gray-900 dark:text-white mb-1">Control Center</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 font-medium uppercase tracking-wider">Property & Privacy Management</p>
            </div>
            
            <div class="flex gap-2 w-full md:w-auto">
                <button onclick="showTab('properties')" id="btn-prop" class="flex-1 md:flex-none px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest btn-outline active">
                    Approvals
                </button>
                <button onclick="showTab('requests')" id="btn-req" class="flex-1 md:flex-none px-6 py-3 rounded-xl text-xs font-bold uppercase tracking-widest btn-outline">
                    Requests
                </button>
            </div>
        </div>

        <div id="tab-properties" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full py-24 flex flex-col items-center justify-center opacity-50">
                <i class="fas fa-circle-notch fa-spin text-gold text-4xl mb-4"></i>
                <p class="text-xs uppercase tracking-widest">Scanning System...</p>
            </div>
        </div>

        <div id="tab-requests" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4"></div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, query, where, getDocs, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Security Check
        onAuthStateChanged(auth, (user) => {
            if (!user || user.email !== 'admin@rajchavin.com') window.location.href = 'real-estate-login.html';
            else { loadPendingProperties(); loadAccessRequests(); }
        });

        // Theme Toggle
        const themeBtn = document.getElementById('theme-toggle');
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
        themeBtn.addEventListener('click', () => { document.documentElement.classList.toggle('dark'); localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light'; });

        // Tabs
        window.showTab = (tab) => {
            document.getElementById('tab-properties').classList.toggle('hidden', tab !== 'properties');
            document.getElementById('tab-requests').classList.toggle('hidden', tab !== 'requests');
            
            const btnProp = document.getElementById('btn-prop');
            const btnReq = document.getElementById('btn-req');
            
            if(tab === 'properties') {
                btnProp.classList.add('active'); btnReq.classList.remove('active');
            } else {
                btnReq.classList.add('active'); btnProp.classList.remove('active');
            }
        }

        // --- LOAD PROPERTIES (Multi-Image Compact View) ---
        async function loadPendingProperties() {
            const container = document.getElementById('tab-properties'); container.innerHTML = '';
            const q = query(collection(db, "properties"), where("status", "==", "pending"));
            const snapshot = await getDocs(q);

            if(snapshot.empty) { 
                container.innerHTML = `
                <div class="col-span-full py-20 text-center border border-dashed border-gray-300 dark:border-white/10 rounded-2xl">
                    <p class="text-gray-500 text-sm">All clear. No pending approvals.</p>
                </div>`; 
                return; 
            }

            snapshot.forEach(docSnap => {
                const d = docSnap.data();
                
                // Image Logic (Array vs Single string fallback)
                const images = d.images && d.images.length > 0 ? d.images : (d.image ? [d.image] : ['https://via.placeholder.com/400']);
                
                // Generate Carousel HTML
                const slidesHtml = images.map(img => `
                    <div class="flex-shrink-0 w-full h-full snap-center bg-gray-800 relative">
                        <img src="${img}" class="w-full h-full object-cover">
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="glass-panel rounded-2xl overflow-hidden shadow-lg group hover:shadow-xl transition duration-300 flex flex-col">
                        
                        <div class="relative h-60 w-full bg-gray-900">
                            <div class="flex overflow-x-auto snap-x snap-mandatory scrollbar-hide h-full w-full">
                                ${slidesHtml}
                            </div>
                            
                            <div class="absolute top-3 left-3 bg-black/60 backdrop-blur-md px-2 py-1 rounded text-[10px] font-bold text-white uppercase tracking-wider border border-white/10">
                                ${d.type}
                            </div>
                            <div class="absolute top-3 right-3 bg-gold text-dark px-2 py-1 rounded text-[10px] font-bold uppercase shadow-lg">
                                Review
                            </div>
                            
                            <div class="absolute bottom-3 right-3 bg-black/60 text-white text-[10px] px-2 py-1 rounded backdrop-blur-md font-bold border border-white/10">
                                <i class="fas fa-camera mr-1 text-gold"></i> ${images.length}
                            </div>
                        </div>

                        <div class="p-5 flex flex-col flex-1">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-serif font-bold text-lg text-gray-900 dark:text-white leading-tight line-clamp-1">${d.title}</h3>
                                <p class="text-gold font-mono font-bold">₹${d.price.toLocaleString()}</p>
                            </div>
                            
                            <div class="bg-gray-100 dark:bg-white/5 p-3 rounded-xl mb-4 text-xs space-y-2 border border-gray-200 dark:border-white/5">
                                <div class="flex justify-between text-gray-600 dark:text-gray-300">
                                    <span>Seller:</span> <span class="font-bold text-gray-900 dark:text-white">${d.sellerName}</span>
                                </div>
                                <div class="flex justify-between text-gray-600 dark:text-gray-300">
                                    <span>Phone:</span> <span class="font-mono text-gray-900 dark:text-white">${d.sellerPhone}</span>
                                </div>
                                <div class="flex justify-between text-gray-600 dark:text-gray-300 border-t border-gray-200 dark:border-white/10 pt-2 mt-1">
                                    <span>Location:</span> <span>${d.location}</span>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3 mt-auto">
                                <button onclick="updateStatus('properties','${docSnap.id}','approved')" class="py-3 bg-green-500/10 text-green-600 dark:text-green-400 border border-green-500/30 rounded-xl text-xs font-bold uppercase hover:bg-green-500 hover:text-white transition">
                                    Approve
                                </button>
                                <button onclick="updateStatus('properties','${docSnap.id}','rejected')" class="py-3 bg-red-500/10 text-red-600 dark:text-red-400 border border-red-500/30 rounded-xl text-xs font-bold uppercase hover:bg-red-500 hover:text-white transition">
                                    Reject
                                </button>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // --- LOAD REQUESTS (Compact List) ---
        async function loadAccessRequests() {
            const container = document.getElementById('tab-requests'); container.innerHTML = '';
            const q = query(collection(db, "access_requests"), where("status", "==", "pending"));
            const snapshot = await getDocs(q);

            if(snapshot.empty) { 
                container.innerHTML = '<p class="col-span-full text-center text-gray-500 py-10 text-sm">No new contact requests.</p>'; 
                return; 
            }

            snapshot.forEach(async docSnap => {
                const d = docSnap.data();
                const userSnap = await getDoc(doc(db, "users", d.buyerId));
                const userData = userSnap.exists() ? userSnap.data() : { name: 'Unknown', phone: 'N/A' };

                container.innerHTML += `
                    <div class="glass-panel p-5 rounded-2xl flex flex-col justify-between gap-4 border-l-4 border-gold shadow-sm">
                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <p class="text-[10px] text-gold font-bold uppercase tracking-widest">Buyer Request</p>
                                <span class="text-[10px] font-mono text-gray-400 bg-black/20 px-2 rounded">ID: ${d.propertyId.slice(0,6)}</span>
                            </div>
                            <h4 class="text-base font-bold text-gray-900 dark:text-white">${userData.name}</h4>
                            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">${userData.phone}</p>
                            <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${d.buyerEmail}</p>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="updateStatus('access_requests','${docSnap.id}','approved')" class="py-2 bg-green-600 text-white rounded-lg text-[10px] font-bold uppercase shadow-lg shadow-green-900/20">Grant</button>
                            <button onclick="updateStatus('access_requests','${docSnap.id}','rejected')" class="py-2 bg-red-600 text-white rounded-lg text-[10px] font-bold uppercase shadow-lg shadow-red-900/20">Deny</button>
                        </div>
                    </div>`;
            });
        }

        window.updateStatus = async (col, id, status) => { 
            await updateDoc(doc(db, col, id), { status }); 
            loadPendingProperties(); 
            loadAccessRequests(); 
        };
        
        document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth).then(() => window.location.href = 'real-estate-login.html'));
    </script>
</body>
</html>
