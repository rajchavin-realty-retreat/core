<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajchavin | Secure Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: '#3b82f6', bg: '#09090b' } } }
        }
    </script>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            transition: background-color 0.3s, color 0.3s;
        }

        /* Light Mode Styles */
        body { background-color: #f3f4f6; color: #1f2937; }
        .glass-panel { 
            background: rgba(255, 255, 255, 0.9); 
            border: 1px solid rgba(0,0,0,0.1); 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .input-field {
            background-color: white;
            border-color: #e5e7eb;
            color: #1f2937;
        }

        /* Dark Mode Styles (Overrides) */
        .dark body { background-color: #09090b; color: white; }
        .dark .glass-panel { 
            background: rgba(24, 24, 27, 0.95); 
            border: 1px solid rgba(255,255,255,0.1); 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
        }
        .dark .input-field {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .glass-panel { border-radius: 20px; padding: 2rem; width: 100%; max-width: 400px; transition: all 0.3s; }
    </style>
</head>
<body>

    <div class="absolute top-6 right-6 z-50">
        <button id="theme-toggle" class="w-10 h-10 rounded-full bg-white dark:bg-white/10 border border-gray-200 dark:border-white/10 flex items-center justify-center hover:scale-110 transition shadow-lg text-gray-800 dark:text-white">
            <i class="fas fa-sun hidden dark:block"></i>
            <i class="fas fa-moon block dark:hidden"></i>
        </button>
    </div>

    <div class="glass-panel text-center relative z-10">
        <div class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-2xl flex items-center justify-center text-3xl text-white mb-6 mx-auto shadow-lg">
            <i class="fas fa-shield-alt"></i>
        </div>
        <h1 class="text-3xl font-bold mb-1">Rajchavin</h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mb-8">Central Authentication</p>

        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email Address" class="input-field w-full border rounded-xl p-3 outline-none focus:border-brand transition">
            <input type="password" id="password" placeholder="Password" class="input-field w-full border rounded-xl p-3 outline-none focus:border-brand transition">
            
            <button onclick="handleLogin()" class="w-full bg-brand hover:bg-blue-600 text-white font-bold py-3.5 rounded-xl shadow-lg transition transform active:scale-95">
                Secure Login
            </button>
        </div>
        <p id="error-msg" class="text-red-500 text-xs mt-4 hidden">Invalid Credentials</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- THEME LOGIC ---
        const themeBtn = document.getElementById('theme-toggle');
        const html = document.documentElement;

        // 1. Load Preference on Start
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }

        // 2. Toggle Handler
        themeBtn.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

        // --- FIREBASE LOGIC ---
        const firebaseConfig = {
            apiKey: "AIzaSyDHHQXki7JAzDsnsKH6LoLNRYlySfnxW7Y",
            authDomain: "rajchavin-live.firebaseapp.com",
            projectId: "rajchavin-live",
            storageBucket: "rajchavin-live.firebasestorage.app",
            messagingSenderId: "626552794688",
            appId: "1:626552794688:web:92988d178bde6c8e6439a5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Check for existing session
        const session = JSON.parse(localStorage.getItem('rajchavin_user'));
        if(session) {
            redirectUser(session.role);
        }

        window.handleLogin = async () => {
            const email = document.getElementById('email').value.trim();
            const pass = document.getElementById('password').value.trim();
            const err = document.getElementById('error-msg');
            
            err.classList.add('hidden');

            try {
                const q = query(collection(db, "users"), where("email", "==", email));
                const snapshot = await getDocs(q);
                let user = null;
                
                snapshot.forEach(doc => { 
                    if (doc.data().password === pass) user = { id: doc.id, ...doc.data() }; 
                });

                if (user) {
                    // Save Session
                    localStorage.setItem('rajchavin_user', JSON.stringify(user));
                    redirectUser(user.role);
                } else {
                    err.innerText = "Invalid Credentials";
                    err.classList.remove('hidden');
                }
            } catch(e) {
                console.error(e);
                err.innerText = "Connection Error";
                err.classList.remove('hidden');
            }
        };

        function redirectUser(role) {
            if (role === 'developer') window.location.href = 'dev.html';
            else if (role === 'banker') window.location.href = 'banker.html';
            else if (role === 'saver') window.location.href = 'saver.html';
            else alert("Unknown Role: " + role);
        }
    </script>
</body>
</html>
